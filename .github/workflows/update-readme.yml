name: Update README Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Profile Summary Cards (All-time)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          USERNAME: V-CodeSmith
          THEME: "default"
          AUTO_PUSH: false

      - name: Generate Stats Card (Transparent)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=V-CodeSmith&show_icons=true&bg_color=00000000&title_color=97fb00&text_color=E0E0E0&icon_color=97fb00&hide_border=true&rank_icon=percentile&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Top Languages (Compact)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=V-CodeSmith&layout=compact&langs_count=10&bg_color=00000000&title_color=97fb00&text_color=E0E0E0&hide_border=true
          path: profile/top-langs-compact.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Top Languages (Donut)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=V-CodeSmith&layout=donut&langs_count=8&bg_color=00000000&title_color=97fb00&text_color=E0E0E0&hide_border=true
          path: profile/top-langs-donut.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Top Languages (Pie)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=V-CodeSmith&layout=pie&langs_count=8&bg_color=00000000&title_color=97fb00&text_color=E0E0E0&hide_border=true
          path: profile/top-langs-pie.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate Streak Card (Transparent, readable numbers)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=V-CodeSmith&background=00000000&hide_border=true&ring=97fb00&fire=97fb00&currStreakNum=E0E0E0&sideNums=E0E0E0&currStreakLabel=97fb00&sideLabels=E0E0E0&dates=6B6B6B&stroke=97fb00
          path: profile/streak.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile/ profile-summary-card-output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update readme cards"
          fi
          git push origin main
